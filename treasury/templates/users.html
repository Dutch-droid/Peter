{% extends "base.html" %}{% block content %}
<h1>Users</h1>
<table><tr><th>Username</th><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr>
{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.full_name }}</td><td>{{ u.email }}</td>
<td><form method="post" action="/admin/users/{{ u.id }}/role" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf }}"><select name="role">{% for r in ROLES %}<option {{ 'selected' if r==u.role else '' }}>{{ r }}</option>{% endfor %}</select><button>Set</button></form></td>
<td>{{ 'Yes' if u.active else 'No' }}</td>
<td><form method="post" action="/admin/users/{{ u.id }}/toggle" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button>{{ 'Deactivate' if u.active else 'Activate' }}</button></form>
<form method="post" action="/admin/users/{{ u.id }}/password" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input name="password" type="password" placeholder="New password" autocomplete="new-password"><button>Reset</button></form></td></tr>{% endfor %}</table>
<h2>Add user</h2>
<form method="post" action="/admin/users" class="card grid3"><input type="hidden" name="csrf_token" value="{{ csrf }}">
<label>Username<input name="username" required></label><label>Full name<input name="full_name"></label><label>Email<input name="email" type="email"></label>
<label>Role<select name="role">{% for r in ROLES %}<option>{{ r }}</option>{% endfor %}</select></label>
<label>Password (10+ chars, mixed case, a digit)<input name="password" type="password" autocomplete="new-password" required></label><div><button>Create</button></div></form>
{% endblock %}
